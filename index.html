<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulgarian Local Flags</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #141414;
      color: #f0f0f0;
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.25rem;
    }
    .card {
      background: #1f1f1f;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }
    .card img {
      width: 100%;
      height: 130px;
      object-fit: contain;
      background: #111;
      border-radius: 4px;
    }
    .card h3 { margin: 0.75rem 0 0.25rem; font-size: 1.05rem; }
    .card p { margin: 0; color: #999; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>Bulgarian Local Flags</h1>

  <div class="gallery">
    <!-- Copy and paste this <div class="card"> block for each flag -->
    <div class="card">
      <img src="images/flag1.svg" alt="Flag 1">
      <h3>Municipality / Settlement Name</h3>
      <p>Province · Official</p>
    </div>

    <div class="card">
      <img src="images/flag2.png" alt="Flag 2">
      <h3>Municipality / Settlement Name</h3>
      <p>Province · Unofficial</p>
    </div>
  </div>
</body>
</html>
